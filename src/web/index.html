<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15803d" />
    <meta name="description" content="Liste de courses familiale : listes partagées, tickets de caisse, budget et santé." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Cabas</title>
    <script>
      // Applique le thème avant le premier rendu (évite le flash blanc en mode sombre)
      try {
        var t = localStorage.getItem("cabas-theme") || "SYSTEM";
        if (t === "DARK" || (t === "SYSTEM" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
